<h1>personal-reports のプライバシーポリシー</h1>
<p>personal-reports は、開発者（kuwabaky）が自分の AdMob の報告を読むためだけに使う道具です。一般の利用者には提供していません。</p>
<ul>
<li>読むのは、開発者本人の AdMob アカウントの報告（収益と広告の表示の数字）だけです。ほかの人のデータは扱いません。</li>
<li>読んだ数字は、開発者本人のコンピューターの中だけに置き、第三者に渡しません。</li>
<li>この道具への許可は、Google アカウントの設定（サードパーティとの接続）から、いつでも取り消せます。</li>
</ul>
